<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>湖南航空 B-321U 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07131e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}#v{position:fixed;inset:0}canvas{width:100%;height:100%;display:block}.top{position:fixed;top:12px;left:12px;z-index:5;background:#07131ecc;padding:10px 12px;border-radius:10px;font-weight:700}.top small{display:block;color:#9fb2c2;font-weight:400;margin-top:3px}.bar{position:fixed;left:8px;right:8px;bottom:12px;z-index:5;display:flex;gap:6px;overflow:auto;padding:5px;background:#07131ecc;border-radius:12px}.bar button{flex:0 0 auto;border:1px solid #31516a;background:#10283b;color:#fff;padding:9px 12px;border-radius:9px}.bar button.on{background:#0877a9}.load{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#07131e;text-align:center}.load span{color:#a9bdcc;font-size:13px}.err{max-width:300px;line-height:1.6}</style></head><body><div id="v"></div><div class="top">湖南航空 B-321U<small>A320neo · MSN10379 · Air Travel 湖南航空</small></div><div class="bar"><button data-k="all" class="on">整机</button><button data-k="cockpit">驾驶舱</button><button data-k="engine">发动机</button><button data-k="wing">机翼</button><button data-k="gear">起落架</button><button data-k="tail">尾翼</button></div><div class="load" id="load"><div><b>正在载入 B-321U 3D 模型</b><br><span>首次打开需要数秒</span></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const host=document.querySelector('#v'),scene=new THREE.Scene();scene.background=new THREE.Color(0x163149);const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,300);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.7));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x304050,2.5));let dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(15,20,10);scene.add(dl);const c=new OrbitControls(cam,r.domElement);c.enableDamping=true;let plane=new THREE.Group();scene.add(plane);let L=40,W=34,H=5;function tex(txt,color='#222',size=110){let x=document.createElement('canvas');x.width=1600;x.height=250;let q=x.getContext('2d');q.font=`600 ${size}px Arial,Microsoft YaHei`;q.fillStyle=color;q.textAlign='center';q.textBaseline='middle';q.fillText(txt,800,125);let t=new THREE.CanvasTexture(x);t.colorSpace=THREE.SRGBColorSpace;return t}function decal(t,w,h,x,y,z,ry=0){let m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide,depthWrite:false}));m.position.set(x,y,z);m.rotation.y=ry;m.renderOrder=20;plane.add(m)}function livery(){let red=new THREE.MeshStandardMaterial({color:0xe31826,roughness:.4,side:THREE.DoubleSide});let sh=new THREE.Shape();sh.moveTo(-2,-1);sh.lineTo(2,-1);sh.lineTo(1,5);sh.lineTo(-1.2,4);sh.closePath();let g=new THREE.ShapeGeometry(sh);for(let z of [.16,-.16]){let m=new THREE.Mesh(g,red);m.position.set(-L/2+2.5,1,z);plane.add(m)}let logo=tex('➤','white',190);decal(logo,2.7,2.2,-L/2+2.5,3.5,.18);decal(logo,2.7,2.2,-L/2+2.5,3.5,-.18,Math.PI);let title=tex('Air Travel 湖南航空','#202020',105);decal(title,12,1.7,5,1.1,2.05);decal(title,12,1.7,5,1.1,-2.05,Math.PI);let reg=tex('B-321U','#202020',110);decal(reg,4,1,-L/2+7,.7,2.05);decal(reg,4,1,-L/2+7,.7,-2.05,Math.PI)}function norm(g){let b=new THREE.Box3().setFromObject(g),s=new THREE.Vector3();b.getSize(s);if(s.z>s.x)g.rotation.y=Math.PI/2;g.updateMatrixWorld(true);b.setFromObject(g);b.getSize(s);g.scale.multiplyScalar(40/s.x);g.updateMatrixWorld(true);b.setFromObject(g);let ctr=new THREE.Vector3();b.getCenter(ctr);g.position.sub(ctr);g.updateMatrixWorld(true);b.setFromObject(g);b.getSize(s);L=s.x;W=s.z;H=s.y}function fly(p,t){let p0=cam.position.clone(),t0=c.target.clone(),st=performance.now();function f(n){let u=Math.min(1,(n-st)/800);u=u*u*(3-2*u);cam.position.lerpVectors(p0,p,u);c.target.lerpVectors(t0,t,u);if(u<1)requestAnimationFrame(f)}requestAnimationFrame(f)}const V={all:()=>[[30,11,29],[0,0,0]],cockpit:()=>[[L/2+5,3,7],[L/2-1,1,0]],engine:()=>[[5,-2,8],[4,-1,3]],wing:()=>[[2,11,17],[0,0,2]],gear:()=>[[1,-5,7],[0,-2,0]],tail:()=>[[-L/2-3,5,8],[-L/2+2,2,0]]};function go(k){let[a,b]=V[k]();fly(new THREE.Vector3(...a),new THREE.Vector3(...b));document.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===k))}document.querySelectorAll('button').forEach(x=>x.onclick=()=>go(x.dataset.k));new GLTFLoader().load('https://raw.githubusercontent.com/amvlab/aircraft-models/main/models/A320_nologo.glb',g=>{plane.add(g.scene);norm(g.scene);livery();document.querySelector('#load').style.display='none';go('all')},undefined,e=>{document.querySelector('#load').innerHTML='<div class="err"><b>3D资源暂时没有载入</b><br><span>请刷新页面重试。</span></div>';console.error(e)});function loop(){requestAnimationFrame(loop);c.update();r.render(scene,cam)}loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
