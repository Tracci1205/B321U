ss="btn" data-v="tail">尾翼 / 涂装</button><div class="note">本版使用可公开访问的 A320 GLB 底模，并按湖南航空官方 A320 四视图喷涂方案重做 B-321U 外观。可拖拽旋转、双指缩放。</div></div><div class="ui top">B-321U · 湖南航空 · A320neo 3D 展示</div><div class="load" id="load"><div><b>正在载入 B-321U 3D 模型</b><small>iPad / iPhone 首次打开可能需要几秒</small></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const mount=document.querySelector('#m'),scene=new THREE.Scene();scene.background=new THREE.Color(0x132837);const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.05,300);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.65));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.15;mount.appendChild(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x24394a,2.2));let d=new THREE.DirectionalLight(0xffffff,3.5);d.position.set(20,25,20);scene.add(d);let d2=new THREE.DirectionalLight(0xa8d8ff,1.3);d2.position.set(-18,7,-18);scene.add(d2);const c=new OrbitControls(cam,r.domElement);c.enableDamping=true;c.dampingFactor=.06;c.minDistance=7;c.maxDistance=90;const plane=new THREE.Group();scene.add(plane);const WHITE=0xf4f5f3,RED=0xd4003f,G50=0x90999f,G80=0x53595e;function tex(draw,w=1800,h=320){let x=document.createElement('canvas');x.width=w;x.height=h;let q=x.getContext('2d');draw(q,w,h);let t=new THREE.CanvasTexture(x);t.colorSpace=THREE.SRGBColorSpace;return t}function text(s,size=92){return tex((q,w,h)=>{q.clearRect(0,0,w,h);q.font=`600 ${size}px Arial,Microsoft YaHei,sans-serif`;q.fillStyle='#4c5155';q.textAlign='center';q.textBaseline='middle';q.fillText(s,w/2,h/2)})}function logo(){return tex((q)=>{q.fillStyle='#d4003f';q.beginPath();q.moveTo(120,190);q.lineTo(360,80);q.lineTo(570,115);q.lineTo(760,185);q.lineTo(570,185);q.lineTo(390,235);q.closePath();q.fill();q.fillStyle='#8f989e';q.beginPath();q.moveTo(390,235);q.lineTo(560,190);q.lineTo(920,190);q.lineTo(760,250);q.lineTo(535,270);q.closePath();q.fill()},1100,320)}function tailmark(){return tex((q)=>{q.fillStyle='#fff';q.beginPath();q.moveTo(90,210);q.lineTo(275,105);q.lineTo(410,135);q.lineTo(565,70);q.lineTo(495,205);q.lineTo(360,235);q.lineTo(210,235);q.closePath();q.fill();q.beginPath();q.moveTo(285,237);q.lineTo(410,242);q.lineTo(565,320);q.lineTo(405,302);q.lineTo(245,248);q.closePath();q.fill()},700,400)}function decal(t,w,h,x,y,z,ry=0,rx=0,rz=0){let m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide,depthWrite:false,toneMapped:false}));m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.renderOrder=30;plane.add(m)}function normalize(g){let b=new THREE.Box3().setFromObject(g),s=new THREE.Vector3();b.getSize(s);if(s.y>s.x&&s.y>s.z)g.rotation.z=-Math.PI/2;else if(s.z>s.x&&s.z>s.y)g.rotation.y=Math.PI/2;g.updateMatrixWorld(true);b.setFromObject(g);b.getSize(s);g.scale.multiplyScalar(40/Math.max(s.x,s.y,s.z));g.updateMatrixWorld(true);b.setFromObject(g);let ctr=new THREE.Vector3();b.getCenter(ctr);g.position.sub(ctr);g.updateMatrixWorld(true)}function recolor(g){g.updateMatrixWorld(true);let inv=new THREE.Matrix4().copy(plane.matrixWorld).invert();g.traverse(o=>{if(!o.isMesh||!o.geometry?.attributes?.position)return;let p=o.geometry.attributes.position,a=new Float32Array(p.count*3),v=new THREE.Vector3(),cl=new THREE.Color();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld).applyMatrix4(inv);let x=v.x,y=v.y,z=v.z,hex=WHITE;if(x<-10.7&&Math.abs(z)<3.4)hex=G50;if(x<-14.0&&y>1.15)hex=RED;if(Math.abs(z)>14.0)hex=RED;if(y<-1.0&&Math.abs(z)>2.4&&Math.abs(z)<8.5)hex=G50;if(y<-1.5&&Math.abs(z)<3.2)hex=G80;cl.setHex(hex);a[i*3]=cl.r;a[i*3+1]=cl.g;a[i*3+2]=cl.b}o.geometry.setAttribute('color',new THREE.BufferAttribute(a,3));o.material=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.42,metalness:.08,side:THREE.DoubleSide})})}function livery(){for(let side of[1,-1]){let z=side*2.06,ry=side<0?Math.PI:0;decal(text(side>0?'Air Travel 湖南航空':'湖南航空 Air Travel'),10.7,1.18,4.8,1.25,z,ry);decal(text('B-321U',82),3.2,.72,-11.8,.82,z,ry);decal(logo(),2.2,.95,10.7,1.28,z,ry)}decal(tailmark(),4.5,3.2,-17.0,3.8,.16,0,0,0);decal(tailmark(),4.5,3.2,-17.0,3.8,-.16,Math.PI,0,0)}const V={all:[[28,9,28],[0,.4,0]],left:[[2,4,36],[0,.5,0]],right:[[2,4,-36],[0,.5,0]],top:[[0,36,.1],[0,0,0]],bottom:[[0,-30,.1],[0,-1,0]],nose:[[24,3,8],[17,1,0]],engine:[[7,-1,11],[5,-1,4]],tail:[[-25,8,11],[-16,2,0]]};function fly(k){let[a,b]=V[k],p0=cam.position.clone(),t0=c.target.clone(),p1=new THREE.Vector3(...a),t1=new THREE.Vector3(...b),st=performance.now();function f(n){let u=Math.min(1,(n-st)/750);u=u*u*(3-2*u);cam.position.lerpVectors(p0,p1,u);c.target.lerpVectors(t0,t1,u);if(u<1)requestAnimationFrame(f)}requestAnimationFrame(f)}document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');fly(b.dataset.v)});new GLTFLoader().load('https://raw.githubusercontent.com/Ysurac/FlightAirMap-3dmodels/master/a320/glTF2/A320.glb',g=>{plane.add(g.scene);normalize(g.scene);recolor(g.scene);livery();document.querySelector('#load').style.display='none';fly('all')},undefined,e=>{document.querySelector('#load').innerHTML='<div><b>3D 模型载入失败</b><small>请刷新页面重试，或检查网络连接。</small></div>';console.error(e)});function loop(){requestAnimationFrame(loop);c.update();r.render(scene,cam)}loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
