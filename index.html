<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>湖南航空 B-321U 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0c1f30;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}#v{position:fixed;inset:0}canvas{width:100%;height:100%;display:block}.top{position:fixed;top:12px;left:12px;z-index:5;background:#07131ed9;padding:10px 12px;border-radius:10px;font-weight:750;box-shadow:0 6px 24px #0004}.top small{display:block;color:#a7b8c5;font-weight:400;margin-top:3px}.tag{position:fixed;right:12px;top:12px;z-index:5;background:#07131ed9;border:1px solid #ffffff18;color:#bac8d2;padding:8px 10px;border-radius:9px;font-size:11px}.bar{position:fixed;left:8px;right:8px;bottom:12px;z-index:5;display:flex;gap:6px;overflow:auto;padding:5px;background:#07131ee8;border-radius:12px}.bar button{flex:0 0 auto;border:1px solid #365a72;background:#10283b;color:#fff;padding:10px 13px;border-radius:9px;font-size:13px}.bar button.on{background:#0877a9}.load{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#07131e;text-align:center}.load span{color:#a9bdcc;font-size:13px}.err{max-width:300px;line-height:1.6}</style></head><body><div id="v"></div><div class="top">湖南航空 B-321U<small>A320neo · MSN10379 · Air Travel 湖南航空</small></div><div class="tag">第一步 · 涂装校对</div><div class="bar"><button data-k="all" class="on">整机</button><button data-k="left">左视</button><button data-k="right">右视</button><button data-k="top">俯视</button><button data-k="nose">机头</button><button data-k="tail">尾部</button></div><div class="load" id="load"><div><b>正在载入 B-321U 涂装模型</b><br><span>首次打开需要数秒</span></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const host=document.querySelector('#v'),scene=new THREE.Scene();scene.background=new THREE.Color(0x173852);const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,300);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.7));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.12;host.appendChild(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x385067,2.1));let dl=new THREE.DirectionalLight(0xffffff,3.2);dl.position.set(12,18,14);scene.add(dl);let dl2=new THREE.DirectionalLight(0xaed9ff,1.0);dl2.position.set(-16,4,-12);scene.add(dl2);const c=new OrbitControls(cam,r.domElement);c.enableDamping=true;c.dampingFactor=.07;let plane=new THREE.Group();scene.add(plane);let L=40;const RED=0xd90041,GRAY=0x8b969e,DARK=0x535a60,WHITE=0xf7f8f8,BLACK=0x111111;function makeText(text,size=100,color='#444',weight=500){let x=document.createElement('canvas');x.width=2000;x.height=300;let q=x.getContext('2d');q.clearRect(0,0,2000,300);q.font=`${weight} ${size}px Arial,Microsoft YaHei,sans-serif`;q.fillStyle=color;q.textAlign='center';q.textBaseline='middle';q.fillText(text,1000,150);let t=new THREE.CanvasTexture(x);t.colorSpace=THREE.SRGBColorSpace;return t}function birdTexture(color='#fff',bg=null){let x=document.createElement('canvas');x.width=700;x.height=420;let q=x.getContext('2d');q.clearRect(0,0,700,420);if(bg){q.fillStyle=bg;q.fillRect(0,0,700,420)}q.fillStyle=color;q.beginPath();q.moveTo(70,225);q.lineTo(275,115);q.lineTo(395,145);q.lineTo(535,70);q.lineTo(462,207);q.lineTo(330,245);q.lineTo(190,245);q.closePath();q.fill();q.beginPath();q.moveTo(270,245);q.lineTo(405,250);q.lineTo(515,330);q.lineTo(360,315);q.lineTo(225,255);q.closePath();q.fill();let t=new THREE.CanvasTexture(x);t.colorSpace=THREE.SRGBColorSpace;return t}function airlineLogoTexture(){let x=document.createElement('canvas');x.width=600;x.height=300;let q=x.getContext('2d');q.clearRect(0,0,600,300);q.fillStyle='#d90041';q.beginPath();q.moveTo(70,170);q.lineTo(235,82);q.lineTo(350,110);q.lineTo(420,165);q.lineTo(300,165);q.lineTo(200,205);q.closePath();q.fill();q.fillStyle='#8b969e';q.beginPath();q.moveTo(200,205);q.lineTo(315,170);q.lineTo(485,170);q.lineTo(405,225);q.lineTo(275,235);q.closePath();q.fill();let t=new THREE.CanvasTexture(x);t.colorSpace=THREE.SRGBColorSpace;return t}function decal(tex,w,h,x,y,z,ry=0){let m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthWrite:false,toneMapped:false}));m.position.set(x,y,z);m.rotation.y=ry;m.renderOrder=30;plane.add(m);return m}function shapePlane(points,color,x,y,z,ry=0){let s=new THREE.Shape();s.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)s.lineTo(points[i][0],points[i][1]);s.closePath();let m=new THREE.Mesh(new THREE.ShapeGeometry(s),new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide,depthWrite:false}));m.position.set(x,y,z);m.rotation.y=ry;m.renderOrder=24;plane.add(m)}function addWindows(){let win=makeText('●',150,'#17191b',700);for(let side of [1,-1]){let z=side*2.055,ry=side<0?Math.PI:0;let xs=[];for(let x=-11.4;x<=13.2;x+=.82)xs.push(x);for(let x of xs){if(Math.abs(x-8.7)<.65||Math.abs(x+8.8)<.65)continue;decal(win,.27,.32,x,.72,z,ry)}let reg=makeText('B-321U',90,'#3f454a',500);decal(reg,3.6,.75,-12.7,.78,z,ry);let title=makeText(side>0?'Air Travel 湖南航空':'湖南航空 Air Travel',92,'#4e5458',500);decal(title,10.8,1.25,5.0,1.30,z,ry);let lg=airlineLogoTexture();decal(lg,2.2,1.05,10.5,1.35,z+.002*side,ry)}let cp=makeText('◼  ◼',190,'#101214',800);decal(cp,2.5,.85,17.7,1.30,1.60);decal(cp,2.5,.85,17.7,1.30,-1.60,Math.PI)}function addLiveryOverlays(){for(let side of [1,-1]){let z=side*2.07,ry=side<0?Math.PI:0;shapePlane([[-4,-1.55],[4,-1.55],[4,2.5],[-2.2,2.5],[-4,.4]],GRAY,-14.7,.10,z,ry)}let bird=birdTexture('#fff');decal(bird,4.7,3.0,-17.0,3.85,.18);decal(bird,4.7,3.0,-17.0,3.85,-.18,Math.PI);addWindows()}function paintModel(root){root.updateMatrixWorld(true);let inv=new THREE.Matrix4().copy(plane.matrixWorld).invert();root.traverse(o=>{if(!o.isMesh||!o.geometry?.attributes?.position)return;let p=o.geometry.attributes.position,arr=new Float32Array(p.count*3),v=new THREE.Vector3(),col=new THREE.Color();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld).applyMatrix4(inv);let x=v.x,y=v.y,z=v.z;let hex=WHITE;if(x<-10.8&&Math.abs(z)<2.8&&y<2.8)hex=GRAY;if(x<-14.0&&y>1.4)hex=RED;if(Math.abs(z)>14.2)hex=RED;if(y<-0.55&&Math.abs(z)>2.5&&Math.abs(z)<8&&x>-3&&x<8)hex=GRAY;if(y<-1.4&&Math.abs(z)<2.8)hex=DARK;col.setHex(hex);arr[i*3]=col.r;arr[i*3+1]=col.g;arr[i*3+2]=col.b}o.geometry.setAttribute('color',new THREE.BufferAttribute(arr,3));o.material=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.42,metalness:.08,side:THREE.DoubleSide})})}function norm(g){let b=new THREE.Box3().setFromObject(g),s=new THREE.Vector3();b.getSize(s);if(s.z>s.x)g.rotation.y=Math.PI/2;g.updateMatrixWorld(true);b.setFromObject(g);b.getSize(s);g.scale.multiplyScalar(40/s.x);g.updateMatrixWorld(true);b.setFromObject(g);let ctr=new THREE.Vector3();b.getCenter(ctr);g.position.sub(ctr);g.updateMatrixWorld(true);b.setFromObject(g);b.getSize(s);L=s.x}function fly(p,t){let p0=cam.position.clone(),t0=c.target.clone(),st=performance.now();function f(n){let u=Math.min(1,(n-st)/800);u=u*u*(3-2*u);cam.position.lerpVectors(p0,p,u);c.target.lerpVectors(t0,t,u);if(u<1)requestAnimationFrame(f)}requestAnimationFrame(f)}const V={all:[[29,9,28],[0,.3,0]],left:[[3,4,35],[0,.5,0]],right:[[3,4,-35],[0,.5,0]],top:[[0,35,.1],[0,0,0]],nose:[[24,3,8],[17,1,0]],tail:[[-25,7,10],[-16,2,0]]};function go(k){let[a,b]=V[k];fly(new THREE.Vector3(...a),new THREE.Vector3(...b));document.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===k))}document.querySelectorAll('button').forEach(x=>x.onclick=()=>go(x.dataset.k));const modelURL='https://cdn.jsdelivr.net/gh/amvlab/aircraft-models@main/models/A320_nologo.glb';new GLTFLoader().load(modelURL,g=>{plane.add(g.scene);norm(g.scene);paintModel(g.scene);addLiveryOverlays();document.querySelector('#load').style.display='none';go('all')},undefined,e=>{document.querySelector('#load').innerHTML='<div class="err"><b>3D资源暂时没有载入</b><br><span>请刷新页面重试。</span></div>';console.error(e)});function loop(){requestAnimationFrame(loop);c.update();r.render(scene,cam)}loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
